version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "skip-changelog"]
    groups:
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*"]
      tests:
        patterns: ["xunit*", "Microsoft.Testing.*", "Verify*", "Testcontainers*"]
      tooling:
        patterns: ["MinVer", "Microsoft.CodeAnalysis*", "BenchmarkDotNet"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "skip-changelog"]
