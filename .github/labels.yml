# Source of truth for repository labels. Synced by labels.yml workflow on push to master.
# Colors: kind = warm, area = cool, milestone = gray.

- name: "kind:feature"
  color: "0e8a16"
  description: "New user-visible capability"
- name: "kind:bug"
  color: "d73a4a"
  description: "Something behaves wrong"
- name: "kind:perf"
  color: "fbca04"
  description: "Performance"
- name: "kind:chore"
  color: "e4e669"
  description: "Refactoring, tooling, housekeeping"
- name: "kind:question"
  color: "d876e3"
  description: "Question or discussion"
- name: "breaking"
  color: "b60205"
  description: "Breaks public API or generated schema"

- name: "area:model"
  color: "1d76db"
  description: "IsTemporal(), conventions, model validation"
- name: "area:migrations"
  color: "1d76db"
  description: "History DDL, schema evolution, triggers"
- name: "area:writer"
  color: "1d76db"
  description: "Interceptor / trigger history writers, change context"
- name: "area:query"
  color: "1d76db"
  description: "AsOf, AllVersions, History<T>"
- name: "area:docs"
  color: "0075ca"
  description: "Documentation site, README"
- name: "area:ci"
  color: "0075ca"
  description: "Workflows, packaging, release"

- name: "spike"
  color: "5319e7"
  description: "Open question from DESIGN.md — time-boxed investigation"
- name: "v1.1"
  color: "bfbfbf"
  description: "After the first stable release"
- name: "v2"
  color: "bfbfbf"
  description: "Non-goal for v1, tracked for v2"
- name: "efcore-preview"
  color: "f9d0c4"
  description: "Breaks against the next EF Core / Npgsql preview"
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-scoped, good entry point"
- name: "dependencies"
  color: "0366d6"
  description: "Dependabot"
- name: "skip-changelog"
  color: "ffffff"
  description: "Exclude from release notes"
