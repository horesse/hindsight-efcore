name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build, test, pack
    runs-on: ubuntu-latest
    # Testcontainers needs Docker; ubuntu-latest has it. Postgres image is pulled by the tests themselves.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - name: PublicAPI.Shipped.txt sanity check
        # Guards against forgetting Releasing step 3 (CONTRIBUTING.md): once any vX.Y.Z tag exists,
        # PublicAPI.Shipped.txt must have shipped symbols in it, or PublicApiAnalyzers/package
        # validation can't actually protect users of the published package from a breaking change.
        run: |
          if git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            shipped=src/Hindsight.EntityFrameworkCore.PostgreSQL/PublicAPI.Shipped.txt
            symbols=$(grep -cv '^#nullable enable$\|^[[:space:]]*$' "$shipped" || true)
            if [ "$symbols" -eq 0 ]; then
              echo "::error file=$shipped::A release tag exists but $shipped has no shipped symbols. Releasing step 3 in CONTRIBUTING.md (move PublicAPI.Unshipped.txt entries into PublicAPI.Shipped.txt) looks like it was skipped."
              exit 1
            fi
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Format check
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

      # Microsoft.Testing.Platform runner (global.json → test.runner). Options after the project are MTP's, not VSTest's.
      - name: Unit tests
        run: >
          dotnet test --project tests/Hindsight.Tests --no-build --configuration Release
          --report-trx --report-trx-filename unit.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Integration tests
        run: >
          dotnet test --project tests/Hindsight.IntegrationTests --no-build --configuration Release
          --report-trx --report-trx-filename integration.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Docs build (broken links / missing xrefs fail the PR)
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Pack (validate packaging on every build)
        run: dotnet pack src/Hindsight.EntityFrameworkCore.PostgreSQL --no-build --configuration Release --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
