name: Docs

# Builds the DocFX site and publishes it to GitHub Pages on every push to master.
# One-time setup: Repository → Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "DESIGN.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build library (DocFX needs compiled metadata)
        run: dotnet build src/Hindsight.EntityFrameworkCore.PostgreSQL --configuration Release

      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
