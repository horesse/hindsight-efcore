name: Release

# Triggered by publishing a GitHub Release whose tag is `vX.Y.Z` or `vX.Y.Z-preview.N`.
# MinVer derives the package version from that tag, so the release tag IS the version —
# nothing to edit in csproj files.
#
# One-time setup:
#   1. Create an API key on nuget.org scoped to "Push new packages and package versions",
#      glob pattern "Hindsight.*".
#   2. Repository → Settings → Environments → create "nuget" (add "Required reviewers" if you
#      want a manual gate) and put the key there as secret NUGET_API_KEY.

on:
  release:
    types: [published]

permissions:
  contents: write # to attach the .nupkg to the release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Validate tag format
        run: |
          TAG='${{ github.event.release.tag_name }}'
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or v1.2.3-preview.1"
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --solution Hindsight.slnx

      - name: Pack
        run: dotnet pack src/Hindsight.EntityFrameworkCore.PostgreSQL --no-build --configuration Release --output artifacts

      - name: Show what will be pushed
        run: ls -la artifacts

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to the GitHub release
        run: gh release upload '${{ github.event.release.tag_name }}' artifacts/*.nupkg artifacts/*.snupkg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
