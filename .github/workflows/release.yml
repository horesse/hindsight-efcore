name: Release

# Triggered by publishing a GitHub Release whose tag is `vX.Y.Z` or `vX.Y.Z-preview.N`.
# MinVer derives the package version from that tag, so the release tag IS the version —
# nothing to edit in csproj files.
#
# Publishing uses nuget.org Trusted Publishing (OIDC) — no long-lived API key anywhere.
# One-time setup:
#   1. nuget.org → your profile → Trusted Publishing → Add policy:
#        Repository owner: horesse
#        Repository:       hindsight-efcore
#        Workflow file:    release.yml          (file name only, no path)
#        Environment:      nuget                (must match `environment:` below)
#   2. Repository → Settings → Environments → create "nuget"; add yourself as Required reviewer
#      (manual gate before anything reaches nuget.org) and add secret NUGET_USER = your nuget.org
#      profile name (not the e-mail).
#   3. The policy for a public repo is active immediately; the first successful publish pins it
#      to the repository id so a renamed/recreated repo can't reuse it.

on:
  release:
    types: [published]

permissions:
  contents: write  # attach the .nupkg to the release
  id-token: write  # GitHub OIDC token for nuget.org Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Validate tag format
        run: |
          TAG='${{ github.event.release.tag_name }}'
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or v1.2.3-preview.1"
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --solution Hindsight.slnx

      - name: Pack
        run: dotnet pack src/Hindsight.EntityFrameworkCore.PostgreSQL --no-build --configuration Release --output artifacts

      - name: Show what will be pushed
        run: ls -la artifacts

      # Exchanges the OIDC token for a temporary (1h, single-use) API key. Kept right before the
      # push so the key can't expire in between.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to the GitHub release
        run: gh release upload '${{ github.event.release.tag_name }}' artifacts/*.nupkg artifacts/*.snupkg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
